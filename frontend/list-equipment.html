<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List Equipment - Krishi Yantra</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="logo"><span>🚜</span> Krishi Yantra</div>
  <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
  <nav class="nav" id="mainNav">
    <a href="index.html"><i class="fa-solid fa-house"></i> <span data-i18n="nav_home">Home</span></a>
    <a href="equipment.html"><i class="fa-solid fa-tractor"></i> <span data-i18n="nav_equipment">Equipment</span></a>
    <a href="my-bookings.html"><i class="fa-solid fa-calendar-check"></i> <span data-i18n="nav_bookings">My Bookings</span></a>
    <a href="list-equipment.html" class="active"><i class="fa-solid fa-plus"></i> <span data-i18n="nav_list">List Equipment</span></a>
    <a href="weather.html"><i class="fa-solid fa-cloud-sun"></i> <span data-i18n="nav_weather">Weather</span></a>
    <a href="profile.html" id="navProfile" class="hidden"><i class="fa-solid fa-user"></i> <span>Profile</span></a>
    <a href="login.html" id="navLogin"><i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="nav_login">Login</span></a>
    <a href="#" id="navLogout" class="hidden"><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="nav_logout">Logout</span></a>
    <button id="langToggle" class="lang-toggle">हिंदी</button>
  </nav>
</header>

<div class="container">
  <div class="section">
    <div class="form-card" style="max-width:600px;">
      <h2 style="text-align:center;"><i class="fa-solid fa-plus"></i> <span data-i18n="list_equipment_title">List Your Equipment</span></h2>
      <p style="text-align:center; color:var(--text-light); margin:8px 0 20px;">🚜 Tractor - ₹2,500 / day - Available in Sehore, Madhya Pradesh</p>
      <div id="alertContainer"></div>
      <form id="listForm">
        <div class="form-group"><label data-i18n="equipment_name">Equipment Name</label><input type="text" name="name" required placeholder="Mahindra 575 DI Tractor"></div>
        <div class="form-group"><label data-i18n="category">Category</label>
          <select name="type" required>
            <option value="tractor" data-i18n="tractor">Tractor</option>
            <option value="harvester" data-i18n="harvester">Harvester</option>
            <option value="cultivator" data-i18n="cultivator">Cultivator</option>
            <option value="seeder" data-i18n="seeder">Seeder</option>
            <option value="irrigation" data-i18n="irrigation">Irrigation</option>
            <option value="other" data-i18n="other">Other</option>
          </select>
        </div>
        <div class="form-group"><label data-i18n="description">Description</label><textarea name="description" rows="3" placeholder="Powerful 45 HP tractor, well maintained..."></textarea></div>
        <div class="form-group"><label>Price per day (₹)</label><input type="number" name="price_per_day" required min="100" placeholder="2500"></div>
        <div class="form-group"><label data-i18n="location">Location</label><input type="text" name="location" required placeholder="Sehore, Madhya Pradesh"></div>
        <div class="form-group"><label>Image URL</label><input type="url" name="image_url" placeholder="https://images.unsplash.com/... or leave blank for placeholder"></div>
        <div class="form-group"><label data-i18n="filter_availability">Availability</label>
          <select name="availability_status"><option value="available">Available</option><option value="maintenance">Maintenance</option></select>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-large"><i class="fa-solid fa-check"></i> <span data-i18n="submit">Submit</span></button>
      </form>
    </div>
  </div>
</div>

<footer class="footer"><p data-i18n="footer_text">Krishi Yantra - Empowering Farmers 2024</p></footer>
<script src="js/translations.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', ()=>{
  if(!isLoggedIn()){ showAlert('Please login to list equipment','error'); setTimeout(()=>window.location.href='login.html',1200); return; }
  document.getElementById('listForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const form=e.target;
    const data={
      name: form.name.value.trim(),
      type: form.type.value,
      description: form.description.value.trim(),
      price_per_day: parseInt(form.price_per_day.value),
      location: form.location.value.trim(),
      image_url: form.image_url.value.trim() || `https://via.placeholder.com/400x300?text=${encodeURIComponent(form.name.value)}`,
      availability_status: form.availability_status.value
    };
    try{
      const res=await apiFetch('/equipment', { method:'POST', body: JSON.stringify(data) });
      showAlert('Equipment listed successfully!','success');
      setTimeout(()=> window.location.href='equipment.html', 1000);
    }catch(err){ showAlert(err.message,'error'); }
  });
});
</script>
</body>
</html>
