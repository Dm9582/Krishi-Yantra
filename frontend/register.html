<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Krishi Yantra</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="logo"><span>🚜</span> Krishi Yantra</div>
  <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
  <nav class="nav" id="mainNav">
    <a href="index.html"><i class="fa-solid fa-house"></i> <span data-i18n="nav_home">Home</span></a>
    <a href="equipment.html"><i class="fa-solid fa-tractor"></i> <span data-i18n="nav_equipment">Equipment</span></a>
    <a href="my-bookings.html"><i class="fa-solid fa-calendar-check"></i> <span data-i18n="nav_bookings">My Bookings</span></a>
    <a href="list-equipment.html"><i class="fa-solid fa-plus"></i> <span data-i18n="nav_list">List Equipment</span></a>
    <a href="weather.html"><i class="fa-solid fa-cloud-sun"></i> <span data-i18n="nav_weather">Weather</span></a>
    <a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="nav_login">Login</span></a>
    <button id="langToggle" class="lang-toggle">हिंदी</button>
  </nav>
</header>

<div class="container">
  <div class="section">
    <div class="form-card">
      <h2 style="text-align:center; margin-bottom:20px;"><i class="fa-solid fa-user-plus"></i> <span data-i18n="register_title">Join Krishi Yantra</span></h2>
      <div id="alertContainer"></div>
      <form id="registerForm">
        <div class="form-group"><label data-i18n="name">Name</label><input type="text" name="name" required placeholder="Ramesh Kumar"></div>
        <div class="form-group"><label data-i18n="phone">Phone</label><input type="tel" name="phone" required pattern="[6-9][0-9]{9}" placeholder="9876543210"></div>
        <div class="form-group"><label data-i18n="email">Email</label><input type="email" name="email" required placeholder="ramesh@example.com"></div>
        <div class="form-group"><label data-i18n="password">Password</label><input type="password" name="password" required minlength="6" placeholder="Min 6 characters"></div>
        <div class="form-group"><label data-i18n="location">Location</label><input type="text" name="location" placeholder="Sehore, Madhya Pradesh"></div>
        <div class="form-group"><label data-i18n="preferred_language">Preferred Language</label>
          <select name="preferred_language"><option value="en">English</option><option value="hi">हिंदी</option></select>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-large" data-i18n="register_btn">Register</button>
      </form>
      <p style="text-align:center; margin-top:16px;">Already have account? <a href="login.html" style="font-weight:700;">Login</a></p>
    </div>
  </div>
</div>

<footer class="footer"><p data-i18n="footer_text">Krishi Yantra - Empowering Farmers 2024</p></footer>
<script src="js/translations.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
