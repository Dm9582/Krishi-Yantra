<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment - Krishi Yantra</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="logo"><span>🚜</span> Krishi Yantra</div>
  <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
  <nav class="nav" id="mainNav">
    <a href="index.html"><i class="fa-solid fa-house"></i> <span data-i18n="nav_home">Home</span></a>
    <a href="equipment.html" class="active"><i class="fa-solid fa-tractor"></i> <span data-i18n="nav_equipment">Equipment</span></a>
    <a href="my-bookings.html"><i class="fa-solid fa-calendar-check"></i> <span data-i18n="nav_bookings">My Bookings</span></a>
    <a href="list-equipment.html"><i class="fa-solid fa-plus"></i> <span data-i18n="nav_list">List Equipment</span></a>
    <a href="weather.html"><i class="fa-solid fa-cloud-sun"></i> <span data-i18n="nav_weather">Weather</span></a>
    <a href="profile.html" id="navProfile" class="hidden"><i class="fa-solid fa-user"></i> <span>Profile</span></a>
    <a href="login.html" id="navLogin"><i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="nav_login">Login</span></a>
    <a href="#" id="navLogout" class="hidden"><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="nav_logout">Logout</span></a>
    <button id="langToggle" class="lang-toggle">हिंदी</button>
  </nav>
</header>

<div class="container">
  <div class="section">
    <h2><i class="fa-solid fa-tractor"></i> <span data-i18n="equipment_title">Available Equipment</span></h2>
    <div class="filters">
      <div class="filter-group"><label data-i18n="filter_category">Category</label>
        <select id="typeFilter"><option value="all">All</option><option value="tractor" data-i18n="tractor">Tractor</option><option value="harvester" data-i18n="harvester">Harvester</option><option value="cultivator" data-i18n="cultivator">Cultivator</option><option value="seeder" data-i18n="seeder">Seeder</option><option value="irrigation" data-i18n="irrigation">Irrigation</option><option value="other" data-i18n="other">Other</option></select>
      </div>
      <div class="filter-group"><label>Search</label><input type="text" id="searchInput" placeholder="Mahindra, Sehore..."></div>
      <div class="filter-group"><label data-i18n="filter_location">Location</label><input type="text" id="locationFilter" placeholder="Madhya Pradesh"></div>
      <div class="filter-group"><label>Price</label>
        <select id="priceFilter"><option value="">All Prices</option><option value="0-1000">₹0 - ₹1000</option><option value="1000-2000">₹1000 - ₹2000</option><option value="2000-4000">₹2000 - ₹4000</option><option value="4000-10000">₹4000+</option></select>
      </div>
      <div class="filter-group"><label data-i18n="filter_sort">Sort By</label>
        <select id="sortFilter"><option value="">Newest</option><option value="price_asc" data-i18n="sort_price_low">Price: Low to High</option><option value="price_desc" data-i18n="sort_price_high">Price: High to Low</option><option value="rating" data-i18n="sort_rating">Rating</option></select>
      </div>
      <div class="filter-group" style="flex:0;"><label>&nbsp;</label><button id="searchBtn" class="btn btn-primary" style="padding:10px 20px;"><i class="fa-solid fa-magnifying-glass"></i> <span data-i18n="search">Search</span></button></div>
    </div>
    <div id="equipmentGrid" class="grid grid-3"></div>
    <div id="alertContainer"></div>
  </div>
</div>

<footer class="footer"><p data-i18n="footer_text">Krishi Yantra - Empowering Farmers 2024</p></footer>
<script src="js/translations.js"></script>
<script src="js/main.js"></script>
<script src="js/equipment.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async ()=>{
  setupFilters();
  // Pre-fill from URL
  const params = new URLSearchParams(window.location.search);
  if (params.get('search')) document.getElementById('searchInput').value = params.get('search');
  if (params.get('type')) document.getElementById('typeFilter').value = params.get('type');
  const filters = { search: params.get('search')||'', type: params.get('type')||'all' };
  try {
    const data = await fetchEquipment(filters);
    renderEquipmentCards(data, 'equipmentGrid');
  } catch(e){ document.getElementById('equipmentGrid').innerHTML=`<p class="alert alert-error">${e.message}</p>`; }
});
</script>
</body>
</html>
