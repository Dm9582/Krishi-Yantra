<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Krishi Yantra</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="logo"><span>🚜</span> Krishi Yantra</div>
  <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
  <nav class="nav" id="mainNav">
    <a href="index.html"><i class="fa-solid fa-house"></i> <span data-i18n="nav_home">Home</span></a>
    <a href="equipment.html"><i class="fa-solid fa-tractor"></i> <span data-i18n="nav_equipment">Equipment</span></a>
    <a href="my-bookings.html"><i class="fa-solid fa-calendar-check"></i> <span data-i18n="nav_bookings">My Bookings</span></a>
    <a href="list-equipment.html"><i class="fa-solid fa-plus"></i> <span data-i18n="nav_list">List Equipment</span></a>
    <a href="weather.html"><i class="fa-solid fa-cloud-sun"></i> <span data-i18n="nav_weather">Weather</span></a>
    <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> <span data-i18n="nav_profile">Profile</span></a>
    <a href="#" id="navLogout"><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="nav_logout">Logout</span></a>
    <button id="langToggle" class="lang-toggle">हिंदी</button>
  </nav>
</header>

<div class="container">
  <div class="section">
    <div class="grid grid-2" style="align-items:start;">
      <div class="card" style="padding:20px;">
        <h2><i class="fa-solid fa-user"></i> <span data-i18n="profile">Profile</span></h2>
        <div id="alertContainer"></div>
        <div style="margin:16px 0; line-height:2;">
          <div><strong data-i18n="name">Name</strong>: <span id="profileName">-</span></div>
          <div><strong data-i18n="phone">Phone</strong>: <span id="profilePhone">-</span></div>
          <div><strong data-i18n="email">Email</strong>: <span id="profileEmail">-</span></div>
          <div><strong data-i18n="location">Location</strong>: <span id="profileLocation">-</span></div>
          <div><strong>Member Since</strong>: <span id="profileSince">-</span></div>
        </div>
        <form id="profileForm">
          <div class="form-group"><label data-i18n="name">Name</label><input type="text" name="name" required></div>
          <div class="form-group"><label data-i18n="location">Location</label><input type="text" name="location"></div>
          <div class="form-group"><label data-i18n="preferred_language">Preferred Language</label>
            <select name="preferred_language"><option value="en">English</option><option value="hi">हिंदी</option></select>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Update Profile</button>
        </form>
        <button onclick="logout()" class="btn btn-outline btn-block mt-2"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
      <div>
        <div class="card" style="padding:20px;">
          <h3><i class="fa-solid fa-tractor"></i> My Listed Equipment</h3>
          <div id="profileEquipment" class="mt-2"></div>
          <a href="list-equipment.html" class="btn btn-outline mt-2" style="width:100%;">+ List New</a>
        </div>
        <div class="card" style="padding:20px; margin-top:16px;">
          <h3><i class="fa-solid fa-calendar"></i> Recent Bookings</h3>
          <div id="profileBookings" class="mt-2"></div>
          <a href="my-bookings.html" class="btn btn-outline mt-2" style="width:100%;">View All</a>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="footer"><p data-i18n="footer_text">Krishi Yantra - Empowering Farmers 2024</p></footer>
<script src="js/translations.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="js/equipment.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async ()=>{
  if(!isLoggedIn()){ window.location.href='login.html'; return; }
  await loadProfile();
  const user=getUser();
  document.getElementById('profileSince').textContent=formatDate(user.created_at);
  // Load my equipment
  try{
    const all=await apiFetch('/equipment');
    const mine=all.filter(e=>e.owner_id===user.id);
    const container=document.getElementById('profileEquipment');
    if(mine.length===0) container.innerHTML='<p>No equipment listed</p>';
    else container.innerHTML=mine.map(e=>`<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee;"><span>${e.name} (${e.type})</span><span>₹${e.price_per_day}/day</span></div>`).join('');
  }catch(e){ console.error(e); }
  try{
    const bookings=await apiFetch('/bookings');
    const container=document.getElementById('profileBookings');
    if(bookings.length===0) container.innerHTML='<p>No bookings</p>';
    else container.innerHTML=bookings.slice(0,3).map(b=>`<div style="padding:8px 0; border-bottom:1px solid #eee;"><strong>${b.equipment_name}</strong><br><small>${formatDate(b.start_date)} → ${formatDate(b.end_date)} • ₹${b.total_price}</small></div>`).join('');
  }catch(e){ console.error(e); }
  document.getElementById('profileForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const form=e.target;
    try{
      const updated=await apiFetch('/auth/profile', { method:'PUT', body: JSON.stringify({ name: form.name.value.trim(), location: form.location.value.trim(), preferred_language: form.preferred_language.value }) });
      localStorage.setItem('krishi_user', JSON.stringify(updated));
      if(updated.preferred_language) setLanguage(updated.preferred_language);
      showAlert('Profile updated','success');
      loadProfile();
    }catch(err){ showAlert(err.message,'error'); }
  });
});
</script>
</body>
</html>
